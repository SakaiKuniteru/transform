name: transform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 2310

  DB_HOST: postgres
  DB_PORT: 5432

  REDIS_HOST: redis
  REDIS_PORT: 6379

  STORAGE_DRIVER: minio
  STORAGE_ROOT: /app/backend/storage

  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"

  LIBREOFFICE_BIN: soffice
  PANDOC_BIN: pandoc
  TESSERACT_BIN: tesseract
  SEVENZIP_BIN: 7zz
  PDFTOTEXT_BIN: pdftotext
  PDFTOPPM_BIN: pdftoppm
  QPDF_BIN: qpdf
  GHOSTSCRIPT_BIN: gs

x-transform-app: &transform-app
  image: transform-backend:${APP_VERSION:-1.0.0}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env.production
  environment:
    <<: *runtime-environment
  networks:
    - transform-network
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

x-worker: &worker
  <<: *transform-app
  restart: unless-stopped
  stop_grace_period: 6m
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb
    cpus: "1.0"
    mem_limit: 2g
    networks:
      - transform-network
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    cpus: "0.5"
    mem_limit: 768m
    networks:
      - transform-network
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command:
      - server
      - /data
      - --address
      - :9000
      - --console-address
      - :9001
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    cpus: "1.0"
    mem_limit: 2g
    networks:
      - transform-network
    logging: *default-logging

  storage-init:
    <<: *transform-app
    command:
      - npm
      - run
      - storage:init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    cpus: "0.25"
    mem_limit: 256m

  migrate:
    <<: *transform-app
    command:
      - npm
      - run
      - migrate:prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 512m

  backend:
    <<: *transform-app
    restart: unless-stopped
    stop_grace_period: 6m
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_BIND_PORT:-2310}:2310"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:2310/api/v1/health/ready >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1g

  worker-chuyen-doi:
    <<: *worker
    command:
      - npm
      - run
      - worker:chuyen-doi
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-chuyen-doi
    cpus: "0.5"
    mem_limit: 768m

  worker-hinh-anh:
    <<: *worker
    command:
      - npm
      - run
      - worker:hinh-anh
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-hinh-anh
    cpus: "2.0"
    mem_limit: 2g

  worker-tai-lieu:
    <<: *worker
    command:
      - npm
      - run
      - worker:tai-lieu
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-tai-lieu
    cpus: "2.0"
    mem_limit: 3g

  worker-du-lieu:
    <<: *worker
    command:
      - npm
      - run
      - worker:du-lieu
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-du-lieu
    cpus: "1.0"
    mem_limit: 1g

  worker-nen:
    <<: *worker
    command:
      - npm
      - run
      - worker:nen
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-nen
    cpus: "1.0"
    mem_limit: 1g

  worker-ocr:
    <<: *worker
    command:
      - npm
      - run
      - worker:ocr
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-ocr
    cpus: "2.0"
    mem_limit: 2g

  worker-dich:
    <<: *worker
    command:
      - npm
      - run
      - worker:dich
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-dich
    cpus: "0.5"
    mem_limit: 768m

  worker-ai:
    <<: *worker
    command:
      - npm
      - run
      - worker:ai
    environment:
      <<: *runtime-environment
      DB_APPLICATION_NAME: transform-worker-ai
    cpus: "0.5"
    mem_limit: 768m

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  transform-network:
    driver: bridge